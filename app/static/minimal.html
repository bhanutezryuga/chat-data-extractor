<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Base</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
  header { padding: 16px 22px; background: #1e293b; border-bottom: 1px solid #334155; }
  h1 { margin: 0; font-size: 18px; display: inline-block; }
  h1 span { color: #64748b; font-weight: 400; font-size: 13px; }
  .links { float: right; font-size: 12px; }
  .links a { color: #94a3b8; text-decoration: none; margin-left: 14px; }
  .links a:hover { color: #e2e8f0; }
  .usage { margin-top: 10px; font-size: 12px; color: #94a3b8; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .usage b { color: #e2e8f0; }
  .bar { width: 140px; height: 6px; background: #334155; border-radius: 999px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .bar > i { display: block; height: 100%; background: #16a34a; }
  main { max-width: 900px; margin: 0 auto; padding: 22px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 620px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
  .tile { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; }
  .tile .n { font-size: 30px; font-weight: 700; line-height: 1; }
  .tile .l { color: #94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin-top: 8px; }
  .tile.accent .n { color: #0ea5e9; }
  .sec { margin-top: 26px; }
  .sec h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #94a3b8; margin: 0 0 10px; }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; }
  .cat { background: #1e293b; border: 1px solid #334155; border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .cat b { color: #38bdf8; }
  .rec { display: flex; flex-direction: column; gap: 8px; }
  .item { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px 12px; }
  .item .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .item .t { font-weight: 600; }
  .catbadge { font-size: 10px; color: #cbd5e1; background: #0f172a; border: 1px solid #334155; border-radius: 999px; padding: 1px 8px; margin-left: 6px; }
  .status { font-weight: 700; font-size: 10px; }
  .item a { color: #60a5fa; font-size: 12px; text-decoration: none; word-break: break-all; }
  .sum { color: #94a3b8; font-size: 12px; margin-top: 4px; }
  .reason { font-size: 11px; margin-top: 4px; word-break: break-word; font-weight: 600; }
  .reason-raw { color: #475569; font-size: 10px; margin-top: 2px; word-break: break-word; font-family: ui-monospace, Consolas, monospace; }
  .arch-toggle { font-weight: 400; color: #64748b; text-transform: none; letter-spacing: 0; margin-left: 8px; }
  .sec h2 code { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 1px 6px; font-size: 11px; color: #cbd5e1; text-transform: none; letter-spacing: 0; }
  #attention h2 { color: #f59e0b; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .att-actions { display: flex; gap: 8px; align-items: center; font-size: 12px; text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: auto; }
  .att-actions button { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .att-actions button:hover:not(:disabled) { border-color: #64748b; }
  .att-actions button:disabled { opacity: .5; cursor: default; }
  #retry-status { color: #94a3b8; font-weight: 400; }
  #due-sec h2 { color: #0ea5e9; }
  .due-actions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .due-actions button { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .due-actions button:hover:not(:disabled) { border-color: #64748b; }
  .due-actions button:disabled { opacity: .5; cursor: default; }
  .empty { color: #475569; font-size: 13px; }
  footer { text-align: center; color: #64748b; font-size: 11px; padding: 16px; }
</style>
</head>
<body>
<header>
  <div class="links">
    <a id="logout" href="/logout" style="display:none">Sign out ⎋</a>
  </div>
  <h1>Knowledge Base <span>— capture → Logseq</span></h1>
  <div class="usage" id="usage"></div>
</header>

<main>
  <div class="tiles" id="tiles"></div>
  <section class="sec" id="attention" hidden>
    <h2>⚠ Needs attention (<span id="att-count">0</span>)
      <span class="att-actions">
        <span id="retry-status"></span>
        <button id="btn-retry" onclick="doRetry()">🔁 Retry now</button>
        <button id="btn-archive" onclick="doArchiveGone()" hidden>🗑 Archive gone (<span id="gone-count">0</span>)</button>
      </span>
    </h2>
    <div class="rec" id="att-list"></div>
  </section>
  <section class="sec" id="due-sec" hidden>
    <h2>📚 Due to review (<span id="due-count">0</span>)</h2>
    <div class="rec" id="due-list"></div>
  </section>
  <div class="sec"><h2>By category</h2><div class="cats" id="cats"></div></div>
  <div class="sec"><h2>Recent captures</h2><div class="rec" id="recent"></div></div>
  <section class="sec" id="archived-sec" hidden>
    <h2 style="cursor:pointer" onclick="toggleArchived()">🗑 Archived (<span id="arch-count">0</span>)<span class="arch-toggle" id="arch-toggle">▸ show</span></h2>
    <div class="rec" id="archived-list" hidden></div>
  </section>
</main>

<footer id="foot">Loading…</footer>

<script>
const COLOR = { ACTIONABLE:'#16a34a', PROCESSING:'#ca8a04', NEW:'#64748b',
                NEEDS_REVIEW:'#d97706', FAILED:'#dc2626', AWAITING_ACTION:'#7c3aed' };
const ERR_COLOR = { gone:'#64748b', rate_limited:'#f59e0b', unavailable:'#f59e0b', timeout:'#f59e0b',
                    login_expired:'#dc2626', blocked:'#dc2626', budget:'#38bdf8',
                    unsupported:'#64748b', no_content:'#64748b', error:'#dc2626' };
const esc = s => (s==null?'':String(s)).replace(/[&<>"'`]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
const safeHref = u => /^https?:\/\//i.test(u||'') ? u : '#';
const fmt = n => (n||0).toLocaleString();

async function api(p){ const r = await fetch(p); return r.json(); }
async function apiPost(p, body){ const r = await fetch(p, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body||{}) }); return { ok: r.ok, status: r.status, data: await r.json().catch(()=>({})) }; }

let archivedExpanded = false;
let _lastArchived = null;

function toggleArchived(){ archivedExpanded = !archivedExpanded; renderArchived(_lastArchived); }

function renderArchived(arch){
  _lastArchived = arch;
  const sec = document.getElementById('archived-sec');
  if (!arch || arch.count === 0) { sec.hidden = true; return; }
  sec.hidden = false;
  document.getElementById('arch-count').textContent = arch.count;
  document.getElementById('arch-toggle').textContent = archivedExpanded ? '▾ hide' : '▸ show';
  const list = document.getElementById('archived-list');
  list.hidden = !archivedExpanded;
  if (archivedExpanded) {
    list.innerHTML = (arch.items||[]).slice(0,50).map(it => `
      <div class="item">
        <div class="top">
          <span class="t">${esc(it.title || '(no title)')}${it.category?`<span class="catbadge">${esc(it.category)}</span>`:''}</span>
        </div>
        ${it.raw_url?`<a href="${esc(safeHref(it.raw_url))}" target="_blank" rel="noopener">${esc(it.raw_url)}</a>`:''}
        ${it.error_label?`<div class="reason" style="color:${ERR_COLOR[it.error_category]||'#64748b'}">${esc(it.error_label)}</div>`:''}
      </div>`).join('');
  }
}

// "Due to review": the same set /review sends (study items, overdue or due this week).
function renderDue(due){
  const sec = document.getElementById('due-sec');
  if (!due || !due.count) { sec.hidden = true; return; }
  sec.hidden = false;
  document.getElementById('due-count').textContent = due.count;
  document.getElementById('due-list').innerHTML = (due.items||[]).map(it => `
    <div class="item">
      <div class="top">
        <span class="t">${esc(it.title || it.content_type || '(no title)')}${it.category?`<span class="catbadge">${esc(it.category)}</span>`:''}</span>
      </div>
      ${it.raw_url?`<a href="${esc(safeHref(it.raw_url))}" target="_blank" rel="noopener">${esc(it.raw_url)}</a>`:''}
      <div class="due-actions">
        <button data-id="${esc(it.id)}" data-act="revisited">✅ Revisited</button>
        <button data-id="${esc(it.id)}" data-act="snoozed">💤 Snooze</button>
        <button data-id="${esc(it.id)}" data-act="learned">🎓 Learned</button>
      </div>
    </div>`).join('');
}

document.addEventListener('click', async e => {
  const b = e.target.closest('.due-actions button');
  if (!b) return;
  b.parentElement.querySelectorAll('button').forEach(x => x.disabled = true);
  const { ok, data } = await apiPost('/api/revisit', { id: b.dataset.id, action: b.dataset.act });
  if (!ok) { alert(data.error || 'failed'); }
  refresh();
});

async function doRetry(){
  const btn = document.getElementById('btn-retry');
  btn.disabled = true;
  const { ok, status, data } = await apiPost('/api/retry', {});
  document.getElementById('retry-status').textContent =
    ok ? 'retrying in background…' : (status === 409 ? 'already running…' : (data.error || 'failed to start'));
  refresh();
}

async function doArchiveGone(){
  const btn = document.getElementById('btn-archive');
  btn.disabled = true;
  const { ok, data } = await apiPost('/api/archive-gone', {});
  document.getElementById('retry-status').textContent = ok ? `archived ${data.archived||0}` : (data.error || 'failed');
  refresh();
}

function renderUsage(u){
  const el = document.getElementById('usage');
  if(!u || !u.enabled){ el.innerHTML = '<span>Gemini: <b>offline stub</b> (no API key)</span>'; return; }
  const pct = Math.min(100, Math.round(100 * u.today_tokens / (u.daily_token_budget||1)));
  const col = pct < 70 ? '#16a34a' : pct < 90 ? '#ca8a04' : '#dc2626';
  el.innerHTML =
    `<span><b>${esc(u.model)}</b></span>` +
    `<span>tokens today <b>${fmt(u.today_tokens)}</b>/${fmt(u.daily_token_budget)} ` +
    `<span class="bar"><i style="width:${pct}%;background:${col}"></i></span></span>` +
    `<span>requests <b>${fmt(u.today_requests)}</b>/${fmt(u.rpd_limit)}</span>`;
}

async function refresh(){
  const [stats, use, items, fails, arch, due] = await Promise.all(
    [api('/api/stats'), api('/api/usage'), api('/api/items'), api('/api/failures'), api('/api/archived'),
     api('/api/due')]);
  renderUsage(use);
  renderDue(due);
  renderArchived(arch);

  // "Needs attention" — shown ONLY when there are FAILED / NEEDS_REVIEW items
  const att = document.getElementById('attention');
  if (fails && fails.count > 0) {
    document.getElementById('att-count').textContent = fails.count;
    document.getElementById('att-list').innerHTML = (fails.items||[]).slice(0,50).map(it => `
      <div class="item">
        <div class="top">
          <span class="t">${esc(it.title || '(no title)')}${it.category?`<span class="catbadge">${esc(it.category)}</span>`:''}</span>
          <span class="status" style="color:${COLOR[it.status]||'#888'}">${esc(it.status)}</span>
        </div>
        ${it.raw_url?`<a href="${esc(safeHref(it.raw_url))}" target="_blank" rel="noopener">${esc(it.raw_url)}</a>`:''}
        ${it.error_label?`<div class="reason" style="color:${ERR_COLOR[it.error_category]||'#f59e0b'}">${esc(it.error_label)}</div>`:''}
        ${it.reason?`<div class="reason-raw">${esc(it.reason)}</div>`:''}
      </div>`).join('');
    att.hidden = false;

    const running = !!fails.retry_running;
    document.getElementById('btn-retry').disabled = running;
    const goneCount = (fails.items||[]).filter(it => it.error_category === 'gone').length;
    const archBtn = document.getElementById('btn-archive');
    archBtn.hidden = goneCount === 0;
    archBtn.disabled = running;
    document.getElementById('gone-count').textContent = goneCount;
    const statusEl = document.getElementById('retry-status');
    if (running) {
      statusEl.textContent = 'retrying in background…';
    } else if (fails.last_retry && !statusEl.textContent.startsWith('archived')) {
      const lr = fails.last_retry;
      statusEl.textContent = `last retry: reprocessed ${lr.processed||0}, recovered ${lr.recovered||0}`;
    }
  } else {
    att.hidden = true;
  }

  const statuses = stats.statuses || {};
  const total = Object.values(statuses).reduce((a,b)=>a+b, 0);
  const captured = statuses.ACTIONABLE || 0;
  const tiles = [
    { n: total, l: 'Captured' },
    { n: stats.revisit_due || 0, l: 'Due to review', accent: true },
    { n: stats.learned || 0, l: 'Learned' },
    { n: stats.logseq ? 'on' : 'off', l: 'Logseq export' },
  ];
  document.getElementById('tiles').innerHTML = tiles.map(t =>
    `<div class="tile ${t.accent?'accent':''}"><div class="n">${esc(t.n)}</div><div class="l">${esc(t.l)}</div></div>`).join('');

  const cats = stats.categories || {};
  document.getElementById('cats').innerHTML = Object.keys(cats).length
    ? Object.entries(cats).map(([c,n])=>`<span class="cat">${esc(c)} <b>${n}</b></span>`).join('')
    : '<span class="empty">No categorized captures yet.</span>';

  document.getElementById('recent').innerHTML = (items||[]).slice(0,8).map(it => `
    <div class="item">
      <div class="top">
        <span class="t">${esc(it.title || it.content_type || 'item')}${it.category?`<span class="catbadge">${esc(it.category)}</span>`:''}</span>
        <span class="status" style="color:${COLOR[it.status]||'#888'}">${esc(it.status)}</span>
      </div>
      ${it.raw_url?`<a href="${esc(safeHref(it.raw_url))}" target="_blank" rel="noopener">${esc(it.raw_url)}</a>`:''}
      ${it.summary?`<div class="sum">${esc(it.summary)}</div>`:''}
    </div>`).join('') || '<div class="empty">No captures yet — send a link to your Telegram bot.</div>';

  document.getElementById('foot').textContent =
    `${total} items · ${stats.revisit_due||0} due · auto-refresh 10s`;
}

fetch('/healthz').then(r=>r.json()).then(h=>{ if(h.auth) document.getElementById('logout').style.display='inline'; }).catch(()=>{});
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
